[[expertise.items]]
title = "Polymer Materials R&D"
body = "Led material solution development for new-concept appliances across the appliance, electronics and display industries, including transparent EMI shielding for microwave doors and self-heating polymers for heaters."
keys = "Transparent EMI Shielding · Self-heating Polymer"

[[expertise.items]]
title = "Product Marketing & Strategy"
body = "As product manager for polymer materials in TV housings, automotive and IT applications, managed product portfolios and life cycles and contributed to corporate strategy for the chemical business."
keys = "Product Portfolio · Life-cycle Management · Strategy"

[[expertise.items]]
title = "Process Technology"
body = "Deep technical knowledge across polymer synthesis, polymerization, characterization, processing and compounding. Expert in melt-process polycarbonate production (Asahi-Kasei process) and co-rotating twin-screw compounding."
keys = "PC Melt Polymerization · Twin-screw Compounding"

[[expertise.items]]
title = "Product Development"
body = "Developed materials for electronic applications, including flame-retardant TV housings (PC/ABS), washer diaphragms (TPE), transparent plastics (PC) and LED reflectors (Nylon)."
keys = "PC/ABS · TPE · PC · Nylon"

[[expertise.items]]
title = "Research Foundation"
body = "Strong theoretical and experimental grounding in polymer science and engineering, with modeling experience in polymerization kinetics, molecular weight distribution and extrusion."
keys = "Polymerization Kinetics · MWD Modeling · Extrusion"

